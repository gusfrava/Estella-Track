       pops: [{ crop: [40, 1340, 1000, 290], zoom: 1.1 }, { crop: { en: [100, 1005, 475, 120], es: [100, 1005, 365, 120] }, at: [-.08, .035], w: { en: .6, es: .46 }, from: 'log', radius: 70 }],

const img = IMAGES[n], copy = img[lang], theme = THEMES[img.theme];
const byLang = v => (v && !Array.isArray(v) && typeof v === 'object' ? v[lang] : v);
const shots = `screens/${lang}/`;
const root = document.documentElement.style;
Object.entries(theme).forEach(([k, v]) => root.setProperty('--' + k, v));

// Headline: three short lines on the first image, two (plus subline) on the rest.

  andWifi: svg(16, 13, '<path d="M8 13 0 3.3A12.4 12.4 0 0 1 8 .5c3 0 5.8 1 8 2.8z"/>'),

};
const DEVICES = {
  // iPhone 16 Pro proportions: 1206×2622 screen, thin black border, titanium band, Dynamic Island.

// The screen: a status bar strip, the app capture, and (Pixel) the gesture bar; strip colours sampled from the capture.
function screenContent(parent, kind, sw, file) {

  const sample = () => { try {
    const c = document.createElement('canvas'); c.width = 4; c.height = SRC.h; const g = c.getContext('2d'); g.drawImage(app, 0, 0, 4, SRC.h);
    const px = y => { const v = g.getImageData(1, y, 1, 1).data; return `rgb(${v[0]},${v[1]},${v[2]})`; };
    scr.style.setProperty('--scrTop', px(4)); scr.style.setProperty('--scrBottom', px(SRC.h - 4));
  } catch { /* a tainted file image keeps the default colours */ } };

  Object.assign(bar.style, { position: 'absolute', left: 0, right: 0, top: 0, height: statusH + 'px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', color: '#2B1B12', fontFamily: 'Figtree', fontWeight: 600, fontSize: fsz + 'px',
    padding: kind === 'pixel' ? `${statusH * .08}px ${sw * .075}px 0` : `${statusH * .12}px ${sw * .1}px 0 ${sw * .115}px`, boxSizing: 'border-box' });
  const time = el('span', '', bar); time.textContent = '9:41';
  const icons = el('span', '', bar); Object.assign(icons.style, { display: 'flex', alignItems: 'center', gap: sw * .014 + 'px' });

    const isl = el('div', '', scr); Object.assign(isl.style, { position: 'absolute', left: '50%', top: sw * .028 + 'px', width: sw * .31 + 'px', height: sw * .091 + 'px', marginLeft: -sw * .155 + 'px', borderRadius: '999px', background: '#050505' });
    const hi = el('div', '', scr); Object.assign(hi.style, { position: 'absolute', left: '50%', bottom: sw * .02 + 'px', width: sw * .34 + 'px', height: sw * .013 + 'px', marginLeft: -sw * .17 + 'px', borderRadius: '99px', background: '#1a1a1a' });
  } else {
    const cam = el('div', '', scr), r = sw * .036; Object.assign(cam.style, { position: 'absolute', left: '50%', top: statusH / 2 - r / 2 + sw * .004 + 'px', width: r + 'px', height: r + 'px', marginLeft: -r / 2 + 'px', borderRadius: '50%', background: 'radial-gradient(circle at 40% 35%, #2a3240 0 18%, #050505 40%)' });
    const pill = el('div', '', scr); Object.assign(pill.style, { position: 'absolute', left: '50%', bottom: navH / 2 - sw * .006 + 'px', width: sw * .26 + 'px', height: sw * .012 + 'px', marginLeft: -sw * .13 + 'px', borderRadius: '99px', background: '#2B1B12', opacity: .8 });
  }

}

// A device: body with depth (stacked edge layers), side buttons, the screen, and pop-outs floating above it.
function device(kind, x, y, sw, tilt, file, pops) {
  const d = DEVICES[kind], inset = (d.bezel + d.band) * sw, bw = sw + 2 * inset, sh = sw * d.aspect, bh = sh + 2 * inset, R = d.radius * sw + inset;
  const stage = el('div', 'stage');
  Object.assign(stage.style, { position: 'absolute', left: 0, top: 0, width: W + 'px', height: H + 'px', perspective: 3200 * u + 'px', perspectiveOrigin: `${x + bw / 2}px ${y + bh / 2}px` });
  const body = el('div', '', stage), t = tilt || {};
  Object.assign(body.style, { position: 'absolute', left: x + 'px', top: y + 'px', width: bw + 'px', height: bh + 'px', transformStyle: 'preserve-3d',

  if (kind === 'iphone') { btn('left', .155, .05); btn('left', .235, .085); btn('left', .34, .085); btn('right', .26, .12); btn('right', .62, .07); }
  else { btn('right', .22, .085); btn('right', .34, .16); }

  const glass = el('div', '', front);

  const box = { x: inset, y: inset + statusH, w: sw, k };
  pops.forEach(spec => pop(spec, box, front, deep ? 90 * u : 0, deep ? null : { x, y }));
}

// A crop of a capture "lifted" off the screen: in place and a little bigger, or placed freely (from: another screen).
function pop(spec, box, parent, lift, flat) {
  const [cx, cy, cw, ch] = byLang(spec.crop), b = 7 * u, k = box.k, appH = SRC.h * k;

  else { w = cw * k * (spec.zoom || 1.1); x = box.x + (cx + cw / 2) * k - w / 2 + (spec.dx || 0) * box.w; y = box.y + (cy + ch / 2) * k - ch * w / cw / 2 + (spec.dy || 0) * appH; }
  x -= b;
  if (flat) { const edge = 36 * u; x = Math.max(edge, Math.min(W - edge - w - 2 * b - 14 * u, flat.x + x)) - flat.x; }
  const s = w / cw, e = el('div', 'pop', parent);

    left: x + 'px', top: y - b + 'px', width: w + 2 * b + 'px', height: ch * s + 2 * b + 'px', transform: `translateZ(${lift}px)`,
    borderWidth: b + 'px', borderRadius: (spec.radius || 40) * u + 'px', boxShadow: shadow(14, 18),
    backgroundImage: `url(${shots}${spec.from || img.screen}.png)`, backgroundSize: `${SRC.w * s}px auto`, backgroundPosition: `${-cx * s}px ${-cy * s}px`,
  });

function companion(c) {
  const e = el('img', 'char'); e.src = c.src;
  const h = c.h * H;
  e.style.height = h + 'px';
  const place = () => {
    const w = e.naturalWidth / e.naturalHeight * h;

    e.style.bottom = (c.square ? -.08 * h : 0) + 'px';

// Google Play: a Pixel at a different angle on each image. App Store: an iPhone, straight on.
const TILTS = { 1: { ry: 16, rx: 5, rz: -2 }, 2: { rz: -4 }, 3: { ry: -16, rx: 5, rz: 2 }, 5: { ry: -14, rx: 10 }, 6: { ry: 15, rx: 4 }, 7: { rz: 4 }, 8: { ry: -14, rx: 6 }, 9: { ry: 14, rx: 8 }, 10: { rx: 12 } };

document.fonts.ready.then(() => {
  const headBottom = headTop + head.offsetHeight, gap = (size === 'play' ? 70 : 100) * u;

    const w = Math.min(W - pad * 1.2, avail * cw / ch), s = w / cw, b = 9 * u, x = (W - w) / 2 - b, y = headBottom + gap;
