<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128" role="img" aria-labelledby="estella-badge-w1-bronze-title">
  <title id="estella-badge-w1-bronze-title">1 workouts, bronze tier</title>
  <defs><filter id="estella-badge-w1-bronze-sticker" x="-25%" y="-25%" width="160%" height="165%" color-interpolation-filters="sRGB">
    <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="cutout"/>
    <feOffset in="cutout" dx="2" dy="4" result="offset"/>
    <feFlood flood-color="#2B1B12" flood-opacity="0.25"/><feComposite in2="offset" operator="in" result="shadow"/>
    <feFlood flood-color="#FFF1E1"/><feComposite in2="cutout" operator="in" result="border"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="border"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>
  <g id="estella-badge-w1-bronze-artwork" filter="url(#estella-badge-w1-bronze-sticker)" stroke="#2B1B12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <g id="estella-badge-w1-bronze-base"><circle cx="64" cy="61" r="48" fill="#B87847"/><circle cx="64" cy="61" r="40" fill="#FFF7DD"/><path d="M28 46Q39 19 66 21" fill="none" stroke="#F5C79C" stroke-width="5"/><g transform="translate(25 23) scale(.60)"><g class="badge-motion motion-workouts"><path d="M53 77L48 100L37 105M75 77L80 100L92 105" fill="none" stroke="#2B1B12" stroke-width="13"/><path d="M53 77L48 100M75 77L80 100" fill="none" stroke="#E8A36B" stroke-width="8"/><path d="M51 48L43 66L46 82" fill="none" stroke="#2B1B12" stroke-width="12"/><path d="M51 48L43 66L46 82" fill="none" stroke="#E8A36B" stroke-width="7"/><path d="M77 48L83 67L80 81" fill="none" stroke="#2B1B12" stroke-width="12"/><path d="M77 48L83 67L80 81" fill="none" stroke="#E8A36B" stroke-width="7"/><path d="M52 43Q64 35 76 43L79 80H49Z" fill="#127F73" /><path d="M49 76H79L82 88H66L64 82L62 88H46Z" fill="#2B1B12" /><rect x="53" y="17" width="22" height="25" rx="9" fill="#E8A36B"/><path d="M53 23Q47 9 58 13Q65 3 69 13Q83 9 76 24L69 20L59 24Z" fill="#2B1B12" /><path d="M57 29h4M67 29h4M60 35q5 3 9 -1" fill="none" stroke-width="2"/></g></g><rect x="43" y="87" width="42" height="24" rx="9" fill="#FFF1E1"/><g transform="translate(60.0 91)" stroke-width="2.6"><path d="M8 1V7" fill="none" /><path d="M8 9V15" fill="none" /></g></g>
    <g id="estella-badge-w1-bronze-details"></g>
  </g>
<style>
.badge-motion{transform-box:fill-box;transform-origin:50% 85%;animation:idle 3.6s ease-in-out infinite}
.motion-workouts{animation-name:flex}
.motion-records{animation-name:wobble}
.motion-friends{animation-name:idle}
.motion-cheersSent{animation-name:hop}
.motion-cheersReceived{animation-name:wobble}
.motion-copies{animation-name:sneak}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes flex{0%,100%{transform:scale(1)}45%,60%{transform:scale(1.04,1.02)}}
@keyframes wobble{0%,65%,100%{transform:rotate(0)}75%{transform:rotate(-3deg)}85%{transform:rotate(3deg)}}
@keyframes hop{0%,65%,100%{transform:translateY(0)}78%{transform:translateY(-4px)}90%{transform:translateY(1px)}}
@keyframes sneak{0%,100%{transform:translateX(-2px) rotate(-1deg)}50%{transform:translateX(2px) rotate(1deg)}}
.living-flame{transform-box:fill-box;transform-origin:50% 95%;animation:burn 1.35s ease-in-out infinite alternate}
@keyframes burn{0%{transform:rotate(-2deg) scale(.97,1.02)}50%{transform:rotate(1deg) scale(1.025,.97)}100%{transform:rotate(2deg) scale(.98,1.03)}}
.titanium-shine{animation:shine 2.4s ease-in-out infinite}
@keyframes shine{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.living-flame,.titanium-shine,.badge-motion{animation:none}}
</style></svg>