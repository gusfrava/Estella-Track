<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128" role="img" aria-labelledby="estella-stopwatch-title">
  <title id="estella-stopwatch-title">Workout timer</title>
  <defs><filter id="estella-stopwatch-sticker" x="-25%" y="-25%" width="160%" height="165%" color-interpolation-filters="sRGB">
    <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="cutout"/>
    <feOffset in="cutout" dx="2" dy="4" result="offset"/>
    <feFlood flood-color="#2B1B12" flood-opacity="0.25"/><feComposite in2="offset" operator="in" result="shadow"/>
    <feFlood flood-color="#FFF1E1"/><feComposite in2="cutout" operator="in" result="border"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="border"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>
  <g id="estella-stopwatch-artwork" filter="url(#estella-stopwatch-sticker)" stroke="#2B1B12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <g id="estella-stopwatch-base"><rect x="55" y="15" width="18" height="13" rx="4" fill="#FF6A2B"/><path d="M87 34l9 -8l9 10l-9 8Z" fill="#3DC4B3" /><circle cx="64" cy="70" r="37" fill="#FFC94D"/><circle cx="64" cy="70" r="28" fill="#FFF7DD"/><path d="M64 49v22l17 8" fill="none" /><circle cx="64" cy="70" r="4" fill="#FF6A2B"/></g>
    <g id="estella-stopwatch-details"><path d="M43 70h3M82 70h3M64 90v-3" fill="none" /></g>
  </g>
</svg>