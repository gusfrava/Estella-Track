<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="estella-calendar-title">
  <title id="estella-calendar-title">Weekly plan</title>
  <defs><filter id="estella-calendar-sticker" x="-25%" y="-25%" width="160%" height="165%" color-interpolation-filters="sRGB">
