<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="estella-badge-s2-bronze-title">
  <title id="estella-badge-s2-bronze-title">2 weeks in a row, bronze tier</title>
  <defs></defs>
  <g id="estella-badge-s2-bronze-artwork" stroke="#2B1B12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="9"><g transform="translate(2 4)" fill="#2B1B12" stroke="#2B1B12" opacity=".25"><circle cx="64" cy="61" r="48"/><rect x="43" y="87" width="42" height="24" rx="9"/></g><g fill="#FFF1E1" stroke="#FFF1E1"><circle cx="64" cy="61" r="48"/><rect x="43" y="87" width="42" height="24" rx="9"/></g></g><g id="estella-badge-s2-bronze-base"><circle cx="64" cy="61" r="48" fill="#B87847"/><circle cx="64" cy="61" r="40" fill="#FFF7DD"/><path d="M28 46Q39 19 66 21" fill="none" stroke="#F5C79C" stroke-width="5"/><g transform="translate(25 23) scale(.60)"><g class="living-flame"><path d="M64 16Q84 34 78 51Q89 47 91 38Q118 76 92 99Q65 120 39 100Q10 78 36 47Q35 65 47 65Q42 43 64 16Z" fill="#FF6A2B" /><path d="M64 61Q82 78 78 89Q75 101 62 101Q43 99 48 85Q51 78 57 75Q55 86 61 86Q68 83 64 61Z" fill="#FFC94D" /></g></g><rect x="43" y="87" width="42" height="24" rx="9" fill="#FFF1E1"/><g transform="translate(60.0 91)" stroke-width="2.6"><path d="M1 0H7" fill="none" /><path d="M8 1V7" fill="none" /><path d="M1 8H7" fill="none" /><path d="M0 9V15" fill="none" /><path d="M1 16H7" fill="none" /></g></g>
    <g id="estella-badge-s2-bronze-details"></g>
  </g>
<style>
.badge-motion{transform-box:fill-box;transform-origin:50% 85%;animation:idle 3.6s ease-in-out infinite}
.motion-workouts{animation-name:flex}
.motion-records{animation-name:wobble}
.motion-friends{animation-name:idle}
.motion-cheersSent{animation-name:hop}
.motion-cheersReceived{animation-name:wobble}
.motion-copies{animation-name:sneak}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes flex{0%,100%{transform:scale(1)}45%,60%{transform:scale(1.04,1.02)}}
@keyframes wobble{0%,65%,100%{transform:rotate(0)}75%{transform:rotate(-3deg)}85%{transform:rotate(3deg)}}
@keyframes hop{0%,65%,100%{transform:translateY(0)}78%{transform:translateY(-4px)}90%{transform:translateY(1px)}}
@keyframes sneak{0%,100%{transform:translateX(-2px) rotate(-1deg)}50%{transform:translateX(2px) rotate(1deg)}}
.living-flame{transform-box:fill-box;transform-origin:50% 95%;animation:burn 1.35s ease-in-out infinite alternate}
@keyframes burn{0%{transform:rotate(-2deg) scale(.97,1.02)}50%{transform:rotate(1deg) scale(1.025,.97)}100%{transform:rotate(2deg) scale(.98,1.03)}}
.titanium-shine{animation:shine 2.4s ease-in-out infinite}
@keyframes shine{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.living-flame,.titanium-shine,.badge-motion{animation:none}}
</style></svg>